<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Diorama -->
  <div class="background-wrapper">
    <img src="assets/light_bg.jpg" class="bg-img" id="light-bg" alt="Light Mode Background">
    <img src="assets/dark_bg.jpg" class="bg-img" id="dark-bg" alt="Dark Mode Background">
  </div>

  <!-- Main UI Layer -->
  <div class="ui-layer">
    
    <!-- Top Widgets -->
    <header class="top-bar">
      <div style="display: flex; gap: 10px;">
        <button class="pill-btn theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
          <i class="ph ph-moon"></i>
        </button>
        <button class="pill-btn" id="open-widget-modal" title="Add Custom Widget">
          <i class="ph ph-squares-four"></i>
        </button>
      </div>
      <div class="pill-widget" id="weather-widget">
        <i class="ph ph-cloud-sun"></i>
        <span>22°C</span>
      </div>
    </header>

    <!-- Center Content -->
    <main class="center-content">
      <div class="glass-card main-widget">
        <div class="clock-container">
          <h1 id="time">00:00</h1>
          <p id="date">Loading...</p>
        </div>

        <div class="engine-selector-container">
          <select id="engine-select" class="engine-dropdown"></select>
          <button id="open-engine-modal" class="pill-btn small-btn" title="Add Search Engine">
            <i class="ph ph-plus"></i>
          </button>
        </div>
        
        <form class="search-form" id="search-form" action="https://www.google.com/search" method="GET">
          <i class="ph ph-magnifying-glass search-icon"></i>
          <input type="text" name="q" id="search-input" placeholder="Search..." autocomplete="off" autofocus>
        </form>
      </div>
      
      <!-- Custom Widgets -->
      <div class="widgets-grid" id="widgets-grid">
        <!-- Widgets will be injected here -->
      </div>
    </main>

    <!-- Bottom Dock -->
    <footer class="bottom-dock-container">
      <div class="dock glass-card" id="links-container">
        <!-- Links will be injected here by JS -->
      </div>
    </footer>
  </div>

  <!-- Add Link Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="glass-card modal-content">
      <h2>Add New Link</h2>
      <div class="input-group">
        <label for="link-name">Name</label>
        <input type="text" id="link-name" placeholder="e.g. GitHub">
      </div>
      <div class="input-group">
        <label for="link-url">URL</label>
        <input type="url" id="link-url" placeholder="https://github.com">
      </div>
      <div class="input-group">
        <label for="link-icon">Icon (Phosphor class)</label>
        <input type="text" id="link-icon" placeholder="ph-github-logo">
        <small><a href="https://phosphoricons.com/" target="_blank">Find icons here</a></small>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-add">Cancel</button>
        <button class="btn primary" id="save-add">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Search Engine Modal -->
  <div class="modal-overlay" id="engine-modal">
    <div class="glass-card modal-content">
      <h2>Add Search Engine</h2>
      <div class="input-group">
        <label for="engine-name">Name</label>
        <input type="text" id="engine-name" placeholder="e.g. Bing">
      </div>
      <div class="input-group">
        <label for="engine-url">Search URL</label>
        <input type="url" id="engine-url" placeholder="https://www.bing.com/search">
      </div>
      <div class="input-group">
        <label for="engine-param">Query Parameter</label>
        <input type="text" id="engine-param" placeholder="e.g. q">
        <small>The URL parameter used for the search query.</small>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-engine">Cancel</button>
        <button class="btn primary" id="save-engine">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Widget Modal -->
  <div class="modal-overlay" id="widget-modal">
    <div class="glass-card modal-content">
      <h2>Embed Custom Widget</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Paste HTML or iframe code from WidgetBox or Indify.</p>
      <div class="input-group">
        <label for="widget-code">HTML / iframe Code</label>
        <textarea id="widget-code" rows="5" placeholder="<iframe src='...' ></iframe>" style="width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--pill-bg); color: var(--text-main); outline: none; font-size: 14px; resize: vertical;"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-widget">Cancel</button>
        <button class="btn primary" id="save-widget">Save Widget</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
