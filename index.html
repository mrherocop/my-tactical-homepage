<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Background Layer -->
  <div class="background-wrapper" id="background-wrapper">
    <div class="bg-layer" id="bg-active"></div>
    <div class="bg-layer" id="bg-next" style="opacity:0;"></div>
  </div>

  <!-- Main UI -->
  <div class="ui-layer">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-left">
        <button class="pill-btn" id="theme-toggle" title="Toggle Theme"><i class="ph ph-moon"></i></button>
        <button class="pill-btn" id="open-widget-modal" title="Add Widget"><i class="ph ph-squares-four"></i></button>
        <button class="pill-btn" id="open-customize" title="Customize"><i class="ph ph-paint-brush"></i></button>
        <!-- Weather Section -->
        <div class="weather-section" style="display:flex;align-items:center;gap:8px;margin-left:12px;">
          <input type="text" id="weather-city" placeholder="City" style="padding:4px 8px;border-radius:4px;border:none;background:var(--card-bg);color:var(--text-main);" />
          <button class="pill-btn" id="weather-search" title="Get Weather"><i class="ph ph-cloud-sun"></i></button>
          <span id="weather-temp" style="font-size:14px;color:var(--text-muted);"></span>
        </div>
      </div>
      <div class="pill-widget">
        <i class="ph ph-cloud-sun"></i>
        <span>22°C</span>
      </div>
    </header>

    <!-- Center -->
    <main class="center-content">
      <div class="glass-card main-widget">
        <div class="clock-container">
          <h1 id="time">00:00</h1>
          <p id="date">Loading...</p>
        </div>
        <div class="engine-selector-container">
          <select id="engine-select" class="engine-dropdown"></select>
          <button id="open-engine-modal" class="pill-btn small-btn" title="Add Search Engine">
            <i class="ph ph-plus"></i>
          </button>
        </div>
        <form class="search-form" id="search-form" action="https://www.google.com/search" method="GET">
          <i class="ph ph-magnifying-glass search-icon"></i>
          <input type="text" name="q" id="search-input" placeholder="Search Google..." autocomplete="off" autofocus>
        </form>
      </div>
      <div class="widgets-grid" id="widgets-grid"></div>
    </main>

    <!-- Bottom Dock -->
    <footer class="bottom-dock-container">
      <div class="dock glass-card" id="links-container"></div>
    </footer>
  </div>

  <!-- ══════ CUSTOMIZE DRAWER ══════ -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="customize-drawer" id="customize-drawer">
    <div class="drawer-header">
      <h2><i class="ph ph-paint-brush"></i> Customize</h2>
      <button class="drawer-close" id="close-customize"><i class="ph ph-x"></i></button>
    </div>

    <!-- Tabs -->
    <div class="drawer-tabs">
      <button class="drawer-tab active" data-tab="wallpaper">Wallpaper</button>
    </div>

    <!-- Wallpaper Tab -->
    <div class="drawer-panel active" id="tab-wallpaper">
      <div class="theme-wallpaper-section">
        <div class="section-label"><i class="ph ph-sun"></i> Light Mode Wallpaper</div>
        <div class="wp-grid" id="light-wp-grid"></div>
        <label class="btn secondary upload-label" for="upload-light">
          <i class="ph ph-upload-simple"></i> Upload Images
          <input type="file" id="upload-light" accept="image/*" multiple style="display:none;">
        </label>
      </div>
      <div class="theme-wallpaper-section">
        <div class="section-label"><i class="ph ph-moon"></i> Dark Mode Wallpaper</div>
        <div class="wp-grid" id="dark-wp-grid"></div>
        <label class="btn secondary upload-label" for="upload-dark">
          <i class="ph ph-upload-simple"></i> Upload Images
          <input type="file" id="upload-dark" accept="image/*" multiple style="display:none;">
        </label>
      </div>
    </div>


  </aside>

  <!-- ══════ MODALS ══════ -->

  <!-- Add Link -->
  <div class="modal-overlay" id="add-modal">
    <div class="glass-card modal-content">
      <h2>Add Quick Link</h2>
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="link-name" placeholder="e.g. GitHub">
      </div>
      <div class="input-group">
        <label>URL</label>
        <input type="url" id="link-url" placeholder="https://github.com">
      </div>
      <div class="input-group">
        <label>Phosphor Icon <small style="color:var(--text-muted)">(optional — blank = auto favicon)</small></label>
        <input type="text" id="link-icon" placeholder="ph-github-logo">
        <small><a href="https://phosphoricons.com/" target="_blank">Browse icons ↗</a></small>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-add">Cancel</button>
        <button class="btn primary" id="save-add">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Search Engine -->
  <div class="modal-overlay" id="engine-modal">
    <div class="glass-card modal-content">
      <h2>Add Search Engine</h2>
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="engine-name" placeholder="e.g. Bing">
      </div>
      <div class="input-group">
        <label>Search URL</label>
        <input type="url" id="engine-url" placeholder="https://www.bing.com/search">
      </div>
      <div class="input-group">
        <label>Query Parameter</label>
        <input type="text" id="engine-param" placeholder="q">
        <small>Usually <strong>q</strong>. Right-click dropdown to remove a custom engine.</small>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-engine">Cancel</button>
        <button class="btn primary" id="save-engine">Save</button>
      </div>
    </div>
  </div>

  <!-- Embed Widget -->
  <div class="modal-overlay" id="widget-modal">
    <div class="glass-card modal-content">
      <h2>Embed Custom Widget</h2>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:15px;">Paste HTML or an iframe from Indify, WidgetBox, etc.</p>
      <div class="input-group">
        <label>HTML / iframe Code</label>
        <textarea id="widget-code" rows="5" placeholder="<iframe src='...'></iframe>"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancel-widget">Cancel</button>
        <button class="btn primary" id="save-widget">Add Widget</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
